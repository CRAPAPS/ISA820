services:
  isa820:
    build:
      context: .
      dockerfile: Dockerfile
      # Keys come from .env.local at build time, never from the repo.
      # `env_file` below only sets RUNTIME env for the container — it does not
      # feed build args — so the build must be invoked as:
      #     docker compose --env-file .env.local build
      # Without --env-file these resolve empty and the Dockerfile aborts the
      # build rather than shipping an image that cannot reach Supabase.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, NOT localhost. Inside the container localhost resolves to ::1
      # first, while the Next server binds IPv4 0.0.0.0 — busybox wget hits the
      # IPv6 address, gets "connection refused", and the container is reported
      # unhealthy while serving traffic perfectly well. It sat unhealthy for
      # 8 weeks that way, which means no usable health signal and no alerting.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
